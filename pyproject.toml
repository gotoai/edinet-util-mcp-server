[project]
name = "edinet-util-mcp-server"
version = "0.1.0.dev0"
description = "A skill-style MCP server for EDINET (金融庁) API v2 disclosures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edinet_util_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tools"]
markers = ["live: calls the real EDINET API (set EDINET_LIVE=1 to run)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["edinet_util_mcp_server", "snapshot", "fixtures"]
